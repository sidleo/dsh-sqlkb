# dsh-sqlkb bundle patch: inserts the plugin row into a DSH profile roster.
# Applied as a profile bundle layer (declared via package.json `dsh.bundle.patch`)
# over dsh-base. Install with:
#
#   dsh plugin --profile <name> add @sidleo3/dsh-sqlkb
#   # or, from a checkout:
#   dsh plugin --profile <name> add link:/path/to/sqlkb
#
# Row is a bare plugin by npm package name: the node half (exports ".")
# runs in the host process (描述层注入 + sqlkb_search/sqlkb_get/sqlkb_validate).
# 默认数据目录 ~/.agents/sqlkb（sqlkb.mjs 内以 os.homedir() 计算）；
# 如需自定义路径，在本补丁之后用 id 定向补丁覆盖 config：
#
#   - id: yh-sqlkb
#     config:
#       dataDir: /abs/path/to/sqlkb
#       sectionName: yh-sqlkb-registry
#       sectionOrder: 60
#       maxSectionChars: 6000
- insert:
    - id: yh-sqlkb
      name: '@sidleo3/dsh-sqlkb'
      config:
        sectionName: yh-sqlkb-registry
        sectionOrder: 60
        maxSectionChars: 6000